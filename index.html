 return'<section class="bx b-today"><div class="bx-h"><span class="bx-i">'+ico("grid")+'</span><span class="bx-t">Today</span><span class="bx-a">'+nd+"/"+td.length+' done</span></div>'+
  (td.length?'<div class="bar" style="margin-bottom:8px"><i style="width:'+pc+'%"></i></div>'+td.slice(0,8).map(function(x){return ckrow(x[0],x[1])}).join("")+(td.length>8?'<a class="vall" href="#tasks">+'+(td.length-8)+" more →</a>":""):'<div class="empty">Nothing due today. 🎉</div>')+"</section>"}
function weekDays(){var a=[],i,d;for(i=0;i<7;i++){d=new Date();d.setDate(d.getDate()+i);a.push({k:ds(d),l:i==0?"Today":d.toLocaleDateString("en-US",{weekday:"short"}),n:d.getDate()})}return a}
function eventsBlock(){var T=ds(new Date()),days=weekDays(),ev=evList(T,days[6].k);
 return'<section class="bx b-events"><div class="bx-h"><span class="bx-i">'+ico("cal")+'</span><span class="bx-t">Events</span><span class="bx-a">next 7 days</span></div>'+
  (ev.length?ev.slice(0,6).map(function(e){return'<a class="evr" href="#'+e.h+'"><span class="evd">'+(e.d==T?"Today":pd(e.d).toLocaleDateString("en-US",{weekday:"short"})+" "+bmd(e.d))+"</span><span>"+esc(e.t)+"</span></a>"}).join(""):'<div class="empty">No events in the next 7 days.</div>')+"</section>"}
function notesBlock(){var L=liveNotes().sort(function(a,b){return b[0].created-a[0].created}).slice(0,2);
 return'<section class="bx b-notes"><div class="bx-h"><span class="bx-i">'+ico("file")+'</span><span class="bx-t">Notes</span><a class="bx-a" href="#notes">All →</a></div>'+
  (L.length?L.map(function(x){var n=x[0],nm=String(n.name||"").replace(/\s*#[\w-]+/g,"").trim()||n.name;return'<div class="nline"><b>'+esc(nm)+"</b><small>"+(n.due?"Due "+esc(dshort(n.due)):nLeft(n)+"d left")+"</small></div>"}).join(""):'<div class="empty">No live notes.</div>')+"</section>"}
function weekBlock(){var days=weekDays(),wkN=0,
 g=days.map(function(d,i){var L=S.tasks.filter(function(t){return t.status!="Done"&&t.due==d.k});wkN+=L.length;
  return'<div class="wkc'+(i==0?" now":"")+'"><div class="wkh"><span class="lab">'+d.l+"</span><b>"+d.n+'</b></div><div class="wkl">'+(L.length?L.map(function(t){return'<a class="wkt'+(t.priority=="High"?" hi":"")+'" href="#tasks">'+esc(t.name)+"</a>"}).join(""):'<span class="mu wk0">—</span>')+"</div></div>"}).join("");
 return'<section class="bx b-week"><div class="bx-h"><span class="bx-i">'+ico("grid")+'</span><span class="bx-t">Projected this week</span><span class="bx-a">'+plural(wkN,"task")+'</span></div><div class="wkgrid">'+g+"</div></section>"}
function miniCal(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+cal);var y=d.getFullYear(),m=d.getMonth(),first=d.getDay(),n=new Date(y,m+1,0).getDate(),T=ds(new Date()),sel=calSel||T,tk={},ev={},wk=wkData();
 S.tasks.forEach(function(t){if(t.status!="Done"&&t.due)tk[t.due]=(tk[t.due]||0)+1});
 evList("0000-01-01","9999-12-31").forEach(function(e){(ev[e.d]=ev[e.d]||[]).push(e)});
 var h='<section class="bx b-cal"><div class="bx-h"><span class="bx-i">'+ico("cal")+'</span><span class="bx-t">Calendar</span></div><div class="calnav"><button class="cnb" data-cal="-1" aria-label="Previous month">‹</button><b>'+MNL[m]+" "+y+'</b><button class="cnb" data-cal="1" aria-label="Next month">›</button><button class="cnb" data-cal="0">Today</button></div><div class="cal7">',i,k;
 ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(function(x){h+='<span class="ch">'+x+"</span>"});
 for(i=0;i<first;i++)h+="<span></span>";
 for(k=1;k<=n;k++){var s2=ds(new Date(y,m,k)),w2=wk.log[s2]&&wk.log[s2].length;
  h+='<button class="cd'+(ev[s2]?" ev":tk[s2]?" tk":"")+(s2==T?" td":"")+(s2==sel?" sl2":"")+(w2?" wo":"")+'" data-cday="'+s2+'" aria-label="'+esc(MNL[m]+" "+k)+'"><span>'+k+"</span></button>"}
 h+='</div><div class="cleg"><span><i class="lg1"></i>tasks</span><span><i class="lg2"></i>events</span><span><i class="lg3"></i>workout</span></div>';
 var its=[];S.tasks.forEach(function(t){if(t.due==sel&&t.status!="Done")its.push("☐ "+esc(t.name))});(ev[sel]||[]).forEach(function(e){its.push(esc(e.t))});
 var wl=(wk.log[sel]||[]).map(function(q){return wk.names[q]});if(wl.length)its.push("Workout: "+esc(wl.join(", ")));
 return h+'<div class="cdet"><b>'+esc(fmtD(pd(sel)))+"</b>"+(its.length?its.map(function(x){return"<div>"+x+"</div>"}).join(""):'<div class="mu">Nothing scheduled.</div>')+"</div></section>"}
function curTheme(){return document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light"}
function paintTheme(){var b=$("themeBtn");if(b)b.setAttribute("aria-pressed",curTheme()=="dark"?"true":"false")}
function side(p){var dk=curTheme()=="dark",open=S.tasks.filter(function(t){return t.status!="Done"}).length,act=S.projects.map(function(q,i){return[q,i]}).filter(function(x){return x[0].status!="Done"}),
 cnt={tasks:open,projects:act.length,notes:liveNotes().length,content:S.content.filter(function(c){return c.status!="Published"}).length},home=!p||PAGES.indexOf(p)<0||p=="home";
 return'<div class="sbrand"><button class="slogo" id="themeBtn" type="button" aria-label="Dark mode" aria-pressed="'+dk+'" title="Switch light / dark mode">🫀</button><a class="sbtxt" href="#home" title="Go to Dashboard"><b>this is my life</b><small>Private</small></a></div><div class="slab">MENU</div>'+
  SIDEI.map(function(x){var on=x[0]=="home"?home:x[0]==p;return'<a class="sl'+(on?" on":"")+'" href="#'+x[0]+'"'+(on?' aria-current="page"':"")+">"+ico(x[2])+"<span>"+esc(x[1])+"</span>"+(cnt[x[0]]?'<span class="sc">'+cnt[x[0]]+"</span>":"")+"</a>"}).join("")+
  '<div class="ssep" role="separator"></div><div class="slab">ACTIVE PROJECTS</div>'+(act.length?act.slice(0,10).map(function(x){return'<a class="ssub'+(p=="projects"&&openP===x[1]?" on":"")+'" href="#projects" data-pj="'+x[1]+'">'+esc(x[0].name)+"</a>"}).join(""):'<div class="ssub">No active projects</div>')+'<div class="sstat" id="sstat">'+esc(statTxt)+"</div>"}
var ttabClick=1;
function openSide(o){$("side").classList.toggle("open",o);$("scrim").classList.toggle("show",o);$("menuBtn").setAttribute("aria-expanded",o?"true":"false")}
document.addEventListener("click",function(e){var t=e.target,el;if(!t.closest)return;
 if(t.closest("#menuBtn")){openSide(!$("side").classList.contains("open"));return}
 if(t.closest("#themeBtn")){var nt=curTheme()=="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nt);try{localStorage.setItem("lifeos-theme",nt)}catch(e2){}paintTheme();return}
 if(t.id=="scrim"||t.closest("#side a")){openSide(false)}
 if((el=t.closest("[data-pj]"))){e.preventDefault();openP=+el.getAttribute("data-pj");pdelArm=null;if(location.hash!="#projects"){keepOpen=true;location.hash="#projects"}else render();return}
 if((el=t.closest("[data-ttab]"))){ttab=+el.getAttribute("data-ttab");render();return}
 if((el=t.closest("[data-cday]"))){calSel=el.getAttribute("data-cday");render();return}});
document.addEventListener("keydown",function(e){if(e.key=="Escape")openSide(false)});

var TCL={projects:"c1",habits:"c2",finances:"c3",content:"c4"};
function tile(h,big,sub,lines){return'<a class="blk '+TCL[h]+'" href="#'+h+'"><span class="blkh"><span class="lab">'+esc(secName(h))+'</span><span class="blkgo" aria-hidden="true">→</span></span><span class="blkb">'+big+'</span><span class="bls">'+sub+'</span><span class="blkl">'+(lines&&lines.length?lines.map(function(l){return"<span>"+l+"</span>"}).join(""):'<span class="mu">Nothing here yet.</span>')+"</span></a>"}
function tiles(){var T=ds(new Date()),mo=T.slice(0,7),o=[];
 var act=S.projects.filter(function(p){return p.status!="Done"}),ip=act.filter(function(p){return p.status=="In progress"}).length;
 o.push(tile("projects",act.length,ip+" in progress · "+(act.length-ip)+" not started",act.slice().sort(function(a,b){return(b.status=="In progress")-(a.status=="In progress")}).slice(0,3).map(function(p){var st=pStat(p);return esc(p.name)+' <small class="mu">'+(st.all.length?st.done+"/"+st.all.length+" tasks":"no tasks")+"</small>"})));
 var w=wkData(),cnt=[0,0,0,0,0,0],wd=0;Object.keys(w.log).forEach(function(k){if(k.slice(0,7)==mo&&w.log[k].length){wd++;w.log[k].forEach(function(q){if(cnt[q]!=null)cnt[q]++})}});
 var tdw=(w.log[T]||[]).map(function(q){return w.names[q]});
 o.push(tile("habits",wd,"workout days this month · "+(tdw.length?"today: "+esc(tdw.join(", ")):"nothing logged today"),cnt.map(function(c,i){return[c,i]}).filter(function(x){return x[0]>0}).sort(function(a,b){return b[0]-a[0]}).slice(0,3).map(function(x){return esc(w.names[x[1]])+' <small class="mu">'+x[0]+"×</small>"})));
 var fm=S.finances.filter(function(t){return(t.date||"").slice(0,7)==mo}),inc=0,exp=0;fm.forEach(function(t){var a=parseFloat(t.amount)||0;t.type=="Income"?inc+=a:exp+=a});
 o.push(tile("finances",money(inc-exp),"this month · in "+money(inc)+" · out "+money(exp),S.finances.slice().sort(function(a,b){return(b.date||"")<(a.date||"")?-1:1}).slice(0,3).map(function(t){return esc(t.name)+' <small class="mu">'+(t.type=="Income"?"+":"−")+money(parseFloat(t.amount)||0).replace("−","")+" · "+esc(t.project||"Personal")+"</small>"})));
 var pipe=S.content.filter(function(c){return c.status!="Published"}),nx=[];pipe.forEach(function(c){if(c.film&&c.film>=T)nx.push([c.film,"Film",c.name]);if(c.pub&&c.pub>=T)nx.push([c.pub,"Post",c.name])});nx.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0});
 o.push(tile("content",pipe.length,nx.length?"next: "+nx[0][1].toLowerCase()+" "+bmd(nx[0][0])+" · "+esc(nx[0][2]):"in the pipeline · nothing scheduled",pipe.slice(0,3).map(function(c){return esc(c.name)+' <small class="mu">'+esc(c.status)+"</small>"})));
 return o.join("")}
