<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>this is my life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AB%80%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#191919;--pn:#252525;--ln:#373737;--tx:#e6e6e6;--mu:#9b9b9b;--hv:#2f2f2f;--red:#5c2b29;--yel:#564a22;--grn:#244433;--blu:#1f3a52;--ok:#6fbf8b;--bad:#ef8a7e}
@media (prefers-color-scheme:light){:root{--bg:#fff;--pn:#f7f6f3;--ln:#e9e9e7;--tx:#37352f;--mu:#787774;--hv:#efeeeb;--red:#fbe4e4;--yel:#fbf3db;--grn:#dbeddb;--blu:#d3e5ef;--ok:#2f7d4f;--bad:#c4554d}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.cover{height:clamp(120px,22vw,210px);padding-top:env(safe-area-inset-top,0px);background:radial-gradient(120% 140% at 15% 20%,#e3b779 0,transparent 45%),radial-gradient(90% 120% at 85% 10%,#b5583d 0,transparent 55%),linear-gradient(120deg,#8a6a45,#4a5d6b 60%,#2c3a47)}
main{max-width:1280px;margin:0 auto;padding:0 clamp(14px,4vw,48px) 70px}
.icon{font-size:68px;line-height:1;margin-top:-34px}
h1{font-size:clamp(30px,6vw,42px);margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:14px;margin:0 0 6px}
h2{font-size:20px;margin:26px 0 6px;font-weight:650}
h2.h{display:block;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-bottom:10px}
h2.h span{padding:1px 8px;border-radius:5px}
.red span{background:var(--red)}.yel span{background:var(--yel)}.grn span{background:var(--grn)}.blu span{background:var(--blu)}
.qb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--hv)}.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}.btn.x{color:var(--bad)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4f8fd6;outline-offset:1px}
.cols{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3.5fr) minmax(190px,1.5fr);gap:clamp(14px,2.5vw,34px)}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.navl a{display:block;padding:4px 8px;border-radius:6px;color:var(--tx);text-decoration:none}.navl a:hover,.navl a.on{background:var(--hv)}
.it{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--ln)}
.it .n{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:12px;background:var(--hv);border-radius:5px;padding:0 7px;white-space:nowrap}
.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.empty{color:var(--mu);font-size:14px;padding:6px 4px}
input[type=checkbox]{accent-color:#4f8fd6;width:16px;height:16px;flex:none}
.done+.n{text-decoration:line-through;color:var(--mu)}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%}
select.s{width:auto;padding:2px 4px;font-size:13px}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:#4f8fd6;padding:0}
.bar{height:6px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.gl{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:8px}
.gl .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .tag{padding:3px 9px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{font-size:12px;color:var(--mu);display:block}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.tot div{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 14px}.tot b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:500}.r{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.cal>div{min-height:78px;padding:3px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);font-size:12px;overflow:hidden}
.cal .h{min-height:0;color:var(--mu);text-align:center}.cal .o{opacity:.4}.cal .td b{background:#d44c47;color:#fff;border-radius:50%;padding:0 5px}
.ev{display:block;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.t{background:var(--blu)}.ev.f{background:var(--red)}.ev.p{background:var(--grn)}.ev.g{background:var(--yel)}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.calh b{flex:1}
.tools{margin-top:40px;display:flex;gap:8px;flex-wrap:wrap}
.qa{margin:6px 0}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"></div>
<main>
<div class="icon" aria-hidden="true">🫀</div>
<h1>this is my life</h1>
<p class="sub" id="date"></p>
<div id="app"></div>
<div class="tools"><button class="btn" id="exp">Export backup</button><button class="btn" id="imp">Import backup</button><button class="btn x" id="rst">Reset everything</button><input type="file" id="file" accept="application/json" hidden></div>
</main>
<script>
(function(){
var ST=["Not started","In progress","Done"],PRI=["High","Medium","Low"],BL=["Morning","Mid-day","Evening"];
var CS=["Idea","Drafting","Filming","Editing","Ready for review","In review","Approved for publishing","Scheduled","Published","On hold"];
var C={
 tasks:{t:"Tasks",a:"Add task",f:[["name","Task","text"],["status","Status",ST],["priority","Priority",PRI],["due","Due","date"],["project","Project","@p"]]},
 projects:{t:"Projects",a:"Add project",f:[["name","Project","text"],["status","Status",ST],["start","Start","date"],["end","End","date"]]},
 content:{t:"Content",a:"Add content",f:[["name","Title","text"],["status","Stage",CS],["type","Format",["Long form","Short form","Social post"]],["platform","Platform",["YouTube","TikTok","Instagram","LinkedIn","Email","Client"]],["film","Film date","date"],["pub","Publish date","date"]]},
 goals:{t:"Goals",a:"Add goal",f:[["name","Goal","text"],["priority","Priority",["P1","P2","P3"]],["progress","Progress","range"],["deadline","Deadline","date"]]},
 finances:{t:"Finances",a:"Add transaction",f:[["name","Transaction","text"],["type","Type",["Expense","Income"]],["amount","Amount","number"],["category","Category","text"],["date","Date","date"]]},
 notes:{t:"Notes",a:"Add note",f:[["name","Title","text"],["body","Note","area"]]},
 resources:{t:"Resources",a:"Add resource",f:[["name","Title","text"],["kind","Kind",["Article","Video","Tool","Course"]],["link","Link","url"]]},
 books:{t:"Books",a:"Add book",f:[["name","Title","text"],["author","Author","text"],["status","Status",["To read","Reading","Done"]]]},
 vision:{t:"Vision Board",a:"Add vision",f:[["name","What do you want?","text"],["area","Area",["Health","Money","Family","Career","Travel","Growth"]],["why","Why it matters","area"]]}
};
var CL={habits:"Habits",routine:"Daily Routine"};
var PAGES=["goals","projects","tasks","routine","notes","resources","habits","vision","finances","content","books"];
var NAMES={vision:"Vision Board",routine:"Routine"};
var S={},cal=0;
try{S=JSON.parse(localStorage.getItem("lifeos")||"{}")}catch(e){S={}}
Object.keys(C).concat(["habits","routine"]).forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
function save(){try{localStorage.setItem("lifeos",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ds(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function off(n){var d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function money(n){return(n<0?"−":"")+"$"+Math.abs(Math.round(n*100)/100).toLocaleString("en-US")}
function opts(a,v){return a.map(function(o){return"<option"+(o==v?" selected":"")+">"+esc(o)+"</option>"}).join("")}
function inp(f,v,at,cls){var k=f[2];
 if(k=="@p")return"<select "+at+(cls?' class="s"':"")+"><option value=''>None</option>"+S.projects.map(function(p){return"<option"+(p.name==v?" selected":"")+">"+esc(p.name)+"</option>"}).join("")+"</select>";
 if(Array.isArray(k))return"<select "+at+(cls?' class="s"':"")+">"+opts(k,v)+"</select>";
 if(k=="area")return"<textarea "+at+">"+esc(v)+"</textarea>";
 if(k=="range")return'<input type="range" min="0" max="100" value="'+(v||0)+'" '+at+'><small class="mu">'+(v||0)+"%</small>";
 return'<input type="'+k+'" value="'+esc(v)+'" '+at+(k=="number"?' step="any" inputmode="decimal"':"")+">"}
function sel(key,i,field,o,v){return'<select class="s" data-k="'+key+'" data-i="'+i+'" data-f="'+field+'">'+opts(o,v)+"</select>"}
function hd(c,t){return'<h2 class="h '+c+'"><span>'+t+"</span></h2>"}
function form(key){var c=C[key];return'<div class="card"><div class="fields">'+c.f.map(function(f,j){return'<label class="f">'+f[1]+inp(f,f[2]=="range"?0:"",'data-new="'+j+'"')+"</label>"}).join("")+'</div><div class="row"><span></span><button class="btn p" data-add="'+key+'">'+c.a+"</button></div></div>"}
function list(key){var c=C[key],a=S[key];if(!a.length)return'<div class="empty">Nothing here yet. Add your first one above.</div>';
 return a.map(function(it,i){return'<div class="card"><div class="fields">'+c.f.map(function(f,j){return'<label class="f">'+f[1]+inp(f,it[f[0]],'data-k="'+key+'" data-i="'+i+'" data-f="'+f[0]+'"')+"</label>"}).join("")+'</div><div class="row"><span>'+(it.link?'<a class="mu" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">Open link</a>':"")+'</span><button class="btn x" data-del="'+key+'" data-i="'+i+'">Delete</button></div></div>'}).join("")}
function monday(){var d=new Date(),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d)}
function trow(t,i){var o=t.due&&t.due<ds(new Date());return'<div class="it"><input type="checkbox" class="done" data-done="'+i+'" aria-label="Mark done"><span class="n">'+esc(t.name)+'</span>'+(t.priority?'<span class="tag">'+t.priority+"</span>":"")+(t.due?'<small class="'+(o?"bad":"mu")+'">'+esc(t.due)+"</small>":"")+"</div>"}
function tasks(fn,msg){var r=S.tasks.map(function(t,i){return[t,i]}).filter(function(p){return p[0].status!="Done"&&fn(p[0])});return r.length?r.map(function(p){return trow(p[0],p[1])}).join(""):'<div class="empty">'+msg+"</div>"}
function checklist(key,compact){var a=S[key],h="";
 if(!compact)h+='<div class="card"><div class="fields"><label class="f">Name<input type="text" id="cn"></label><label class="f">Time of day<select id="cb">'+opts(BL)+'</select></label></div><div class="row"><span></span><button class="btn p" data-addc="'+key+'">Add</button></div></div>';
 if(!a.length)return h+'<div class="empty">'+(compact?"Nothing yet. Add some on the "+CL[key]+" page.":"Nothing here yet. Add your first one above.")+"</div>";
 BL.forEach(function(b){var m=a.map(function(x,i){return[x,i]}).filter(function(p){return p[0].block==b});if(!m.length)return;
  h+=(compact?'<div class="mu" style="font-size:12px;margin-top:6px">'+b+"</div>":"<h2>"+b+"</h2>")+m.map(function(p){var x=p[0],i=p[1],n=0;while(x.log&&x.log[off(-n)])n++;
   return'<div class="it"><input type="checkbox" class="done" data-chk="'+key+":"+i+'"'+(x.log&&x.log[off(0)]?" checked":"")+' aria-label="Done today"><span class="n">'+esc(x.name)+"</span>"+(n>1?'<small class="mu">'+n+"d</small>":"")+(compact?"":'<button class="btn x" data-delc="'+key+":"+i+'">×</button>')+"</div>"}).join("")});
 return h}
function money2(){var i=0,e=0;S.finances.forEach(function(t){var a=parseFloat(t.amount)||0;t.type=="Income"?i+=a:e+=a});return[i,e]}
function finBlock(full){var m=money2(),r=S.finances.slice().sort(function(a,b){return(b.date||"")<(a.date||"")?-1:1});if(!full)r=r.slice(0,6);
 return'<div class="tot"><div class="ok"><small class="mu">Income</small><b>'+money(m[0])+'</b></div><div class="bad"><small class="mu">Expenses</small><b>'+money(m[1])+'</b></div><div><small class="mu">Net</small><b>'+money(m[0]-m[1])+"</b></div></div>"+
 (r.length?"<table><tr><th>Transaction</th><th>Date</th><th class=r>Amount</th></tr>"+r.map(function(t){return"<tr><td>"+esc(t.name)+"</td><td>"+esc(t.date||"")+'</td><td class="r '+(t.type=="Income"?"ok":"bad")+'">'+(t.type=="Income"?"+":"−")+money(parseFloat(t.amount)||0).replace("−","")+"</td></tr>"}).join("")+"</table>":'<div class="empty">No transactions yet.</div>')}
function calendar(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+cal);var y=d.getFullYear(),m=d.getMonth(),first=(d.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),ev={};
 function add(date,cls,txt){if(date){(ev[date]=ev[date]||[]).push('<span class="ev '+cls+'">'+esc(txt)+"</span>")}}
 S.tasks.forEach(function(t){if(t.status!="Done")add(t.due,"t",t.name)});S.content.forEach(function(c){add(c.film,"f","Film: "+c.name);add(c.pub,"p","Post: "+c.name)});S.goals.forEach(function(g){add(g.deadline,"g","Goal: "+g.name)});
 var h='<div class="calh"><button class="btn" data-cal="-1" aria-label="Previous month">‹</button><b>'+d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</b><button class="btn" data-cal="0">Today</button><button class="btn" data-cal="1" aria-label="Next month">›</button></div><div class="cal">';
 ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(x){h+='<div class="h">'+x+"</div>"});
 for(var i=0;i<first;i++)h+='<div class="o"></div>';
 for(var k=1;k<=n;k++){var s=ds(new Date(y,m,k));h+='<div class="'+(s==ds(new Date())?"td":"")+'"><b>'+k+"</b>"+(ev[s]||[]).join("")+"</div>"}
 return h+"</div>"}
function home(){
 var wk=monday(),we=ds(new Date(new Date(wk+"T00:00").getTime()+6*864e5)),h='';
 var nav='<div class="navl">'+PAGES.map(function(p){return'<a href="#'+p+'">'+(NAMES[p]||C[p]&&C[p].t||CL[p]||p)+"</a>"}).join("")+"</div>";
 var L=hd("blu","Navigation")+nav+hd("","Daily Routine")+checklist("routine",true);
 var act=S.projects.map(function(p,i){return[p,i]}).filter(function(p){return p[0].status=="In progress"});
 var pipe=S.content.map(function(c,i){return[c,i]}).filter(function(p){return p[0].status!="Published"});
 var M=hd("red","Inbox")+'<input class="qa" type="text" id="qa" placeholder="Add a task and press Enter" aria-label="Add a task">'+tasks(function(t){return!t.project},"Inbox is clear.")+
  hd("","This Week")+tasks(function(t){return t.due&&t.due>=wk&&t.due<=we},"Nothing due this week.")+
  hd("","Active Projects")+(act.length?act.map(function(p){var c=S.tasks.filter(function(t){return t.project==p[0].name&&t.status!="Done"}).length;return'<div class="it"><span class="n">'+esc(p[0].name)+'</span><small class="mu">'+c+" open</small>"+sel("projects",p[1],"status",ST,p[0].status)+"</div>"}).join(""):'<div class="empty">No projects in progress.</div>')+
  hd("","Content Pipeline")+(pipe.length?pipe.map(function(p){return'<div class="it"><span class="n">'+esc(p[0].name)+'</span><span class="tag">'+esc(p[0].platform||"")+"</span>"+sel("content",p[1],"status",CS,p[0].status)+"</div>"}).join(""):'<div class="empty">No content in the pipeline.</div>');
 var R=hd("yel","Active Goals")+(S.goals.length?S.goals.map(function(g,i){return'<div class="gl"><div class="t"><span>'+esc(g.name)+"</span><span>"+(g.progress||0)+'%</span></div><div class="bar"><i style="width:'+(g.progress||0)+'%"></i></div><input type="range" min="0" max="100" value="'+(g.progress||0)+'" data-k="goals" data-i="'+i+'" data-f="progress" aria-label="Progress"></div>'}).join(""):'<div class="empty">No goals yet.</div>')+
  hd("grn","Habits")+checklist("habits",true)+hd("","Vision Board")+(S.vision.length?'<div class="chips">'+S.vision.map(function(v){return'<span class="tag">'+esc(v.name)+"</span>"}).join("")+"</div>":'<div class="empty">Empty board.</div>')+
  hd("","Books")+(S.books.length?S.books.map(function(b,i){return'<div class="it"><span class="n">'+esc(b.name)+"</span>"+sel("books",i,"status",["To read","Reading","Done"],b.status)+"</div>"}).join(""):'<div class="empty">No books yet.</div>');
 h+='<h2 class="h">Quick Buttons</h2><div class="qb">'+[["tasks","＋ Task"],["projects","＋ Project"],["content","＋ Content idea"],["notes","＋ Note"],["finances","＋ Transaction"]].map(function(q){return'<a class="btn" style="text-decoration:none;color:inherit" href="#'+q[0]+'" data-focus="1">'+q[1]+"</a>"}).join("")+"</div>";
 h+='<div class="cols"><div>'+L+"</div><div>"+M+"</div><div>"+R+"</div></div>";
 h+=hd("","Income &amp; Expenses")+finBlock(false)+hd("","Calendar")+calendar();
 return h}
function page(p){var t=NAMES[p]||(C[p]&&C[p].t)||CL[p],h='<p><a class="mu" href="#home">← Home</a></p><h2 style="margin-top:6px">'+t+"</h2>";
 if(CL[p])return h+checklist(p,false);
 return h+(p=="finances"?finBlock(true):"")+form(p)+list(p)}
function render(){var p=location.hash.slice(1);var v=p=="home"||!p?home():PAGES.indexOf(p)>=0?page(p):home();$("app").innerHTML=v;
 if(window._f){window._f=0;var n=document.querySelector('[data-new="0"]');if(n)n.focus()}}
document.addEventListener("click",function(e){var b=e.target.closest("button,a"),k,x;if(!b)return;
 if(b.getAttribute("data-focus"))window._f=1;
 if(k=b.getAttribute("data-add")){var c=C[k],o={};[].forEach.call(document.querySelectorAll("[data-new]"),function(el){o[c.f[+el.getAttribute("data-new")][0]]=el.value});
  if(!o.name||!o.name.trim()){document.querySelector('[data-new="0"]').focus();return}S[k].unshift(o);save();render()}
 else if(k=b.getAttribute("data-del")){S[k].splice(+b.getAttribute("data-i"),1);save();render()}
 else if(k=b.getAttribute("data-addc")){var nm=$("cn").value.trim();if(!nm){$("cn").focus();return}S[k].push({name:nm,block:$("cb").value,log:{}});save();render()}
 else if(k=b.getAttribute("data-delc")){x=k.split(":");S[x[0]].splice(+x[1],1);save();render()}
 else if(b.getAttribute("data-cal")!==null){var v=+b.getAttribute("data-cal");cal=v==0?0:cal+v;render()}});
document.addEventListener("change",function(e){var el=e.target,k=el.getAttribute("data-k"),x;
 if(k){S[k][+el.getAttribute("data-i")][el.getAttribute("data-f")]=el.value;save();render()}
 else if(el.getAttribute("data-done")!==null){S.tasks[+el.getAttribute("data-done")].status="Done";save();render()}
 else if(x=el.getAttribute("data-chk")){x=x.split(":");var h=S[x[0]][+x[1]];h.log=h.log||{};if(el.checked)h.log[off(0)]=1;else delete h.log[off(0)];save();render()}});
document.addEventListener("input",function(e){var el=e.target;if(el.type=="range"&&el.getAttribute("data-k")){var g=el.closest(".gl")||el.parentNode,b=g.querySelector(".bar i"),s=g.querySelector(".t span:last-child")||g.querySelector("small");if(b)b.style.width=el.value+"%";if(s)s.textContent=el.value+"%"}});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.id=="qa"&&e.target.value.trim()){S.tasks.unshift({name:e.target.value.trim(),status:"Not started",priority:"Medium"});save();render();$("qa").focus()}});
window.addEventListener("hashchange",render);
$("date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="life-backup.json";a.click()};
$("imp").onclick=function(){$("file").click()};
